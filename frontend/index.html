<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>驗屋糾紛 AI 法律幫手</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #1c3d5a;
    --navy-light: #2a5278;
    --bg: #f2f4f7;
    --white: #ffffff;
    --border: #dde1e8;
    --text: #1c1f24;
    --muted: #6b7280;
    --user-bubble: #1c3d5a;
    --bot-bubble: #ffffff;
    --radius: 16px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html, body { height: 100%; }

  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  header {
    background: var(--navy);
    color: #fff;
    padding: 14px 16px max(14px, env(safe-area-inset-top));
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }
  .header-icon {
    width: 36px; height: 36px;
    background: rgba(255,255,255,.15);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  header h1 { font-size: 16px; font-weight: 700; line-height: 1.3; }
  header p  { font-size: 11px; opacity: .75; margin-top: 2px; line-height: 1.4; }

  /* ── Chat area ── */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    -webkit-overflow-scrolling: touch;
  }

  /* empty state */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin: auto;
    opacity: .6;
    text-align: center;
    padding: 32px 16px;
  }
  .empty-state .icon { font-size: 48px; }
  .empty-state p { font-size: 14px; color: var(--muted); line-height: 1.6; }

  /* suggested questions */
  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 8px;
  }
  .suggestion-btn {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 13px;
    color: var(--navy);
    cursor: pointer;
    line-height: 1.4;
    text-align: left;
  }
  .suggestion-btn:active { background: #e8edf5; }

  /* message bubbles */
  .msg-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  .msg-row.user { flex-direction: row-reverse; }

  .avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
    margin-bottom: 2px;
  }
  .avatar.bot  { background: var(--navy); color: #fff; }
  .avatar.user { background: #e0e7ef; color: var(--navy); }

  .bubble {
    max-width: min(75vw, 520px);
    padding: 11px 14px;
    border-radius: var(--radius);
    line-height: 1.65;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble.user {
    background: var(--user-bubble);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bubble.bot {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }

  /* sources chips */
  .sources {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .source-label { font-size: 11px; color: var(--muted); margin-bottom: 2px; width: 100%; }
  .chip {
    background: #eef1f8;
    color: var(--navy);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 11px;
    font-weight: 500;
  }

  /* typing indicator */
  .typing { display: flex; align-items: center; gap: 4px; padding: 12px 14px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    animation: blink 1.2s ease-in-out infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }

  /* ── Input bar ── */
  .input-bar {
    background: var(--white);
    border-top: 1px solid var(--border);
    padding: 10px 12px calc(10px + var(--safe-bottom));
    display: flex;
    gap: 8px;
    align-items: flex-end;
    flex-shrink: 0;
  }
  textarea {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 9px 14px;
    font-size: 15px;
    font-family: inherit;
    resize: none;
    outline: none;
    line-height: 1.5;
    max-height: 140px;
    overflow-y: auto;
    -webkit-appearance: none;
    background: var(--bg);
    color: var(--text);
    transition: border-color .15s;
  }
  textarea:focus { border-color: var(--navy); background: #fff; }
  textarea::placeholder { color: #aaa; }

  .send-btn {
    width: 40px; height: 40px; flex-shrink: 0;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, transform .1s;
  }
  .send-btn:active { background: var(--navy-light); transform: scale(.94); }
  .send-btn:disabled { background: #b0bec5; cursor: not-allowed; }

  /* ── Disclaimer footer ── */
  .disclaimer {
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    padding: 4px 16px 6px;
    background: var(--white);
    border-top: 1px solid var(--border);
    line-height: 1.5;
    flex-shrink: 0;
  }

  /* desktop: cap width */
  @media (min-width: 640px) {
    header { padding: 16px 24px; }
    header h1 { font-size: 18px; }
    header p  { font-size: 12px; }
    #chat { padding: 20px; max-width: 760px; margin: 0 auto; width: 100%; align-self: center; }
    .input-bar { padding: 12px 16px; }
    .send-btn { width: 44px; height: 44px; }
    .bubble { font-size: 15px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-icon">⚖️</div>
  <div>
    <h1>驗屋糾紛 AI 法律幫手</h1>
    <p>依法條回覆・非正式法律意見・具體案件請洽律師</p>
  </div>
</header>

<div id="chat">
  <div class="empty-state" id="emptyState">
    <div class="icon">🏠</div>
    <p>你好！請描述你的驗屋或房屋交易糾紛，<br>我會根據相關法條幫你分析。</p>
    <div class="suggestions">
      <button class="suggestion-btn">交屋後發現漏水，建商不處理怎麼辦？</button>
      <button class="suggestion-btn">預售屋和廣告內容不符，可以解約嗎？</button>
      <button class="suggestion-btn">驗屋發現結構瑕疵，保固期多久？</button>
      <button class="suggestion-btn">成屋買賣，賣方隱瞞壁癌，有什麼責任？</button>
    </div>
  </div>
</div>

<div class="input-bar">
  <textarea id="input" rows="1" placeholder="描述你的糾紛情況…" maxlength="1000"></textarea>
  <button class="send-btn" id="sendBtn" title="送出" disabled>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"></line>
      <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
    </svg>
  </button>
</div>
<div class="disclaimer">本服務為 AI 自動生成內容，僅供一般法律資訊參考，不構成正式法律意見。具體案件請洽律師或不動產糾紛調處機關。</div>

<script>
const chatEl   = document.getElementById('chat');
const inputEl  = document.getElementById('input');
const sendBtn  = document.getElementById('sendBtn');
const emptyEl  = document.getElementById('emptyState');

// auto-grow textarea
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  sendBtn.disabled = !inputEl.value.trim();
});

// suggested questions
document.querySelectorAll('.suggestion-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    inputEl.value = btn.textContent;
    inputEl.dispatchEvent(new Event('input'));
    inputEl.focus();
  });
});

function hideEmpty() {
  if (emptyEl) emptyEl.remove();
}

function scrollBottom() {
  chatEl.scrollTo({ top: chatEl.scrollHeight, behavior: 'smooth' });
}

function addUserBubble(text) {
  hideEmpty();
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `
    <div class="avatar user">🙋</div>
    <div class="bubble user">${escHtml(text)}</div>`;
  chatEl.appendChild(row);
  scrollBottom();
}

function addTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row';
  row.id = 'typing';
  row.innerHTML = `
    <div class="avatar bot">⚖️</div>
    <div class="bubble bot typing"><span></span><span></span><span></span></div>`;
  chatEl.appendChild(row);
  scrollBottom();
  return row;
}

function removeTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

function addBotBubble(text, sources) {
  const row = document.createElement('div');
  row.className = 'msg-row';
  let srcHtml = '';
  if (sources && sources.length) {
    const chips = sources.map(s => `<span class="chip">《${escHtml(s.law_name)}》第${escHtml(s.article_no)}條</span>`).join('');
    srcHtml = `<div class="sources"><div class="source-label">參考法條</div>${chips}</div>`;
  }
  row.innerHTML = `
    <div class="avatar bot">⚖️</div>
    <div class="bubble bot">${escHtml(text)}${srcHtml}</div>`;
  chatEl.appendChild(row);
  scrollBottom();
}

function addErrorBubble(msg) {
  const row = document.createElement('div');
  row.className = 'msg-row';
  row.innerHTML = `
    <div class="avatar bot">⚖️</div>
    <div class="bubble bot" style="color:#c0392b">⚠️ ${escHtml(msg)}</div>`;
  chatEl.appendChild(row);
  scrollBottom();
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function sendQuestion(question) {
  addUserBubble(question);
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;
  const typingEl = addTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    const data = await res.json();
    removeTyping();
    if (!res.ok) addErrorBubble(data.detail || `伺服器錯誤 (${res.status})`);
    else addBotBubble(data.answer, data.sources);
  } catch (e) {
    removeTyping();
    addErrorBubble('連線失敗：' + e.message);
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

// submit
document.querySelector('.input-bar').addEventListener('submit', e => e.preventDefault());
sendBtn.addEventListener('click', () => {
  const q = inputEl.value.trim();
  if (q) sendQuestion(q);
});
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    const q = inputEl.value.trim();
    if (q) sendQuestion(q);
  }
});
</script>
</body>
</html>
